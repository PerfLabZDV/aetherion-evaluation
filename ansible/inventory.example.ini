# Copy to inventory.ini and replace with your Debian 13 host(s).
# The first host in [swarm_managers] initialises the swarm and runs the stack deploy.

[swarm_managers]
eval-node-01 ansible_host=192.0.2.10

[swarm_workers]
eval-node-02 ansible_host=192.0.2.11
eval-node-03 ansible_host=192.0.2.12

[eval:children]
swarm_managers
swarm_workers

[eval:vars]
ansible_user=debian
